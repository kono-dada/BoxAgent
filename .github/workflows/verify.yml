name: Verify BoxAgent
on:
  push:
    branches:
      - main
      - codex/onboarding-packaging
      - codex/game-web-search
      - codex/multimodal-memory
      - codex/python-quality-baseline
  pull_request:
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm --dir web/panel install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm --dir web/panel build
      - run: pnpm --dir web/panel test
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install portaudio
      - id: sync
        run: uv sync --locked
      - run: uv run --locked ruff check
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked mypy
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked pytest
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uvx --from pyright==1.1.414 pyright --pythonpath "$(uv python find)"
