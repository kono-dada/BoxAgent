name: Verify onboarding
on:
  push:
    branches: [main, 'codex/onboarding-packaging', 'codex/game-web-search']
  pull_request:
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm --dir web/panel install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm --dir web/panel build
      - run: pnpm --dir web/panel test
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: brew install portaudio
      - run: uvx --from pyright==1.1.414 pyright
      - run: UV_CACHE_DIR=/tmp/uvcache uv run --locked --with pytest python -m pytest -q
