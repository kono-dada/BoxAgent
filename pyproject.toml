[project]
name = "boxagent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyaudio==0.2.14",
  "websockets==16.1.1",
  "pillow==12.3.0",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
