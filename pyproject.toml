[project]
name = "boxagent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyaudio==0.2.14",
  "websockets==16.1.1",
  "pillow==12.3.0",
  "zstandard==0.25.0",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
boxagent = "boxagent.entrypoints.desktop:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "networkx>=3.4,<4",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "types-pyaudio>=0.2.16,<0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/boxagent/infrastructure/memory/jev_mem"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"
files = ["src", "tests/test_cli.py"]
exclude = ["^src/boxagent/infrastructure/memory/jev_mem/"]

[[tool.mypy.overrides]]
module = "boxagent.infrastructure.memory.jev_mem.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
