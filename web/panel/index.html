<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>伙伴 · 会话管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-context" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h8M8 17h4"/></symbol>
    <symbol id="i-timeline" viewBox="0 0 24 24"><path d="M6 3v18M11 6h9M11 12h6M11 18h9"/><circle cx="6" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="18" r="2"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2 4.5 4.5 0 0 1 8 2c0 6-8 11-8 11Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-errors" viewBox="0 0 24 24"><path d="m10.2 4-7 12A2 2 0 0 0 5 19h14a2 2 0 0 0 1.8-3l-7-12a2 2 0 0 0-3.6 0ZM12 9v4M12 16h.01"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11Z"/><path d="M8 10h8M8 14h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 8a7 7 0 0 1 11.7-3L20 8M4 16l2.8 3A7 7 0 0 0 18.5 16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M9 5V3h6v2M8 11h8M8 15h5"/></symbol>
  </svg>
  <div class="workspace">
    <aside class="sidebar" aria-label="会话管理导航">
      <div class="window-drag" aria-hidden="true"></div>
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-spark"/></svg></span><div><strong>伙伴</strong><span>会话与记忆</span></div></div>
      <nav class="navigation" aria-label="页面">
        <button data-view="context" aria-current="page"><svg class="icon"><use href="#i-context"/></svg><span>有效上下文</span></button>
        <button data-view="timeline"><svg class="icon"><use href="#i-timeline"/></svg><span>事件时间线</span></button>
        <button data-view="memory"><svg class="icon"><use href="#i-memory"/></svg><span>长期记忆</span></button>
        <button data-view="errors"><svg class="icon"><use href="#i-errors"/></svg><span>诊断日志</span></button>
      </nav>
      <div class="session-heading"><h2>产品会话</h2><span id="session-count">—</span></div>
      <div id="sessions" class="session-list" aria-label="会话列表"></div>
      <footer class="sidebar-footer"><span id="connection" data-state="connecting"><span class="status-dot"></span><span id="status" role="status">正在连接</span></span><span class="local-caption">本机 · 只读查看</span></footer>
    </aside>
    <main class="page" id="page">
      <div class="page-topbar"><span id="scope">产品会话</span><span id="runtime-status">Engine</span></div>
      <div class="page-inner">
        <header class="page-header"><div><p class="eyebrow" id="eyebrow">CONTEXT</p><h1 id="page-title">有效上下文</h1><p class="page-description" id="description">看看这个会话向模型提供了哪些信息。</p></div><button id="refresh" class="button" title="刷新当前数据"><svg class="icon"><use href="#i-refresh"/></svg><span>刷新</span></button></header>
        <div id="summary" class="summary" role="status" aria-live="polite">正在读取会话…</div>
        <div class="content-tools"><label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="查找当前页内容" aria-label="查找当前页内容" autocomplete="off"></label><span id="result-count" class="metadata"></span></div>
        <div id="content" aria-busy="true"></div>
        <p class="page-footnote" id="footnote"></p>
      </div>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-header"><div><p class="eyebrow">DETAIL</p><h2 id="detail-title">记录详情</h2></div><button id="close" class="icon-button" aria-label="关闭详情"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <p id="detail-meta" class="metadata"></p><pre id="full"></pre>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>
